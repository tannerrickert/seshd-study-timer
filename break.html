<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Protected break · Seshd</title>
  </head>
  <body>
    <main class="break-screen">
      <span class="break-mark" aria-hidden="true">☘</span>
      <p class="eyebrow">Protected break</p>
      <h1 id="break-title">Step away for a moment.</h1>
      <p class="break-copy">This time is yours. Look away from the screen, move, or take a breath.</p>
      <p class="break-countdown" id="break-countdown" aria-live="polite">5:00</p>
      <p class="break-footer">Seshd will return you to focus when your break is complete.</p>
    </main>
    <script type="module" src="/src/break.js"></script>
  </body>
</html>
